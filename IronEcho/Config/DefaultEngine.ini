; IRON ECHO engine config. Owner: Claude (technical). Rendering/look settings are proposed by Codex via
; Docs/Handoffs and applied here, or live in Codex's map / post-process assets.

[/Script/EngineSettings.GameMapsSettings]
; Boot into the engine's empty Entry map: the game mode builds a technical gym when no ring anchor exists.
; Switched to Codex's arena map at integration (Docs/Contracts/ROBOT_VISUAL_CONTRACT.md, "Карта").
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/IronEcho.IronEchoGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Realistic look (author's decision 2026-10-02, Docs/Visual/REALISM_BRIEF.md): Lumen GI + reflections, Virtual Shadow
; Maps for crisp multi-spot shadows under the ring truss, TSR. Software Lumen fits an RTX 3050; hardware RT stays off
; until VRAM/FPS are measured on the target PC (Tools/Build/Measure-Hardware.ps1). Not verified in-engine yet.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Lumen.HardwareRayTracing=False
r.SkinCache.CompileShaders=True
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=True
; broadcast look: fixed exposure (set by the arena post process volume), no motion blur smearing the punches
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False

[Core.Log]
LogIronEcho=Log
